<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#2c2c2c"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1280" fill="url(#g)"/>
  <rect width="1920" height="1280" fill="url(#grid)"/>
  <g fill="#ffffff20" font-family="Inter, system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <text x="960" y="640" font-size="48">TODO: Hero photo</text>
    <text x="960" y="700" font-size="20" font-weight="400">replace public/img/hero.svg with a real photo</text>
  </g>
</svg>
